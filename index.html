<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>原型易用性測試</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F6;--surface:#FFFFFF;--sunk:#E7EAF0;--ink:#161A22;--muted:#5A6272;--rule:#D6DAE2;
  --accent:#2C58C9;--onaccent:#FFFFFF;--good:#1F7F55;--bad:#C2412D;--warn:#A86B12;--focus:#2C58C9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1218;--surface:#171B23;--sunk:#12161D;--ink:#E6E9EF;--muted:#9AA2B2;--rule:#2A303C;
  --accent:#7DA2FF;--onaccent:#0F1218;--good:#4CBF8A;--bad:#E8705A;--warn:#E0A84A;--focus:#7DA2FF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1218;--surface:#171B23;--sunk:#12161D;--ink:#E6E9EF;--muted:#9AA2B2;--rule:#2A303C;
  --accent:#7DA2FF;--onaccent:#0F1218;--good:#4CBF8A;--bad:#E8705A;--warn:#E0A84A;--focus:#7DA2FF;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1160px;margin:0 auto;padding:26px 20px 72px}
h1{font-size:25px;line-height:1.3;margin:0}
h2{font-size:18px;margin:0 0 6px}
h3{font-size:15px;margin:0 0 6px}
p{margin:0 0 10px}
.sub{color:var(--muted);margin:4px 0 18px}
.note{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.btn{border:1px solid var(--rule);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],select,textarea{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.banner{border-left:3px solid var(--warn);background:var(--surface);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto;margin:0 0 18px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:500;padding:7px 16px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.top .grow{min-width:220px}
/* setup */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.frameBox{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.frameBar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted)}
.frameBox iframe{display:block;width:100%;height:620px;border:0;background:#fff}
.task{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--surface)}
.task+.task{margin-top:10px}
.task .num{font-weight:700;color:var(--muted);margin-right:6px}
.cond{display:grid;grid-template-columns:150px 1fr;gap:8px}
@media (max-width:520px){.cond{grid-template-columns:1fr}}
.ok{color:var(--good);font-weight:700}
.drop{border:1.5px dashed var(--rule);border-radius:12px;padding:26px;text-align:center;background:var(--surface)}
/* results */
.kpis{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0 0 14px;color:var(--muted);font-size:14px}
.kpis b{color:var(--ink);font-size:20px;margin-right:4px;font-variant-numeric:tabular-nums}
.tcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.tcard+.tcard{margin-top:12px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:10px 0 6px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.metric{background:var(--sunk);border-radius:8px;padding:8px 10px}
.metric b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
table.el{border-collapse:collapse;width:100%;font-size:13px}
.el th,.el td{text-align:left;padding:6px 8px;border-top:1px solid var(--rule)}
.el th{color:var(--muted);font-weight:500;border-top:0}
.el td.n{text-align:right;font-variant-numeric:tabular-nums;width:70px}
.tblwrap{overflow-x:auto}
.miss{color:var(--bad)}
.insight{white-space:pre-wrap;line-height:1.75}
code.rc{display:block;word-break:break-all;background:var(--sunk);padding:10px;border-radius:8px;font-size:12px;max-height:140px;overflow:auto}
/* tester */
body.testing{height:100%;overflow:hidden}
body.testing .wrap{display:none}
#tester{display:none;height:100%;flex-direction:column}
body.testing #tester{display:flex}
.tbar{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.tbar .ttext{flex:1;min-width:0;font-weight:500}
.tbar .step{font-size:13px;color:var(--muted);white-space:nowrap}
#tFrame{flex:1;width:100%;border:0;background:#fff;min-height:0}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px;max-width:520px;width:100%;max-height:100%;overflow:auto}
.card h2{font-size:21px}
.scale{display:flex;gap:6px;margin:8px 0 4px}
.scale button{flex:1;padding:10px 0;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bigtask{font-size:19px;font-weight:700;line-height:1.5;margin:6px 0 14px}

.login{max-width:380px;margin:12vh auto 0}
.linkbox{display:flex;gap:8px}
.linkbox input{font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="admin">
  <header class="row" style="align-items:flex-start">
    <div class="grow"><h1>原型易用性測試</h1>
    <p class="sub">上傳 HTML 原型，AI 會產生測試任務。受測者實際操作後，這裡會整理出成功率、卡關的地方和改善建議。</p></div>
    <button class="btn small hidden" id="btnLogout">登出</button>
  </header>
  <div id="banner" class="banner hidden" role="status"></div>
  <div id="loginBox" class="panel stack login hidden">
    <h2>管理者登入</h2>
    <div><label class="f" for="pw">密碼</label><input type="password" id="pw" autocomplete="current-password" style="background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;width:100%"></div>
    <div class="row"><span class="note grow" id="loginMsg"></span><button class="btn primary" id="btnLogin">登入</button></div>
  </div>
  <div id="main" class="hidden">
    <div class="top">
      <div class="grow"><label class="f" for="studySel">選擇測試</label><select id="studySel"></select></div>
      <button class="btn" id="btnNew">建立新測試</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="功能">
      <button role="tab" id="tab-setup" aria-selected="true">設定任務</button>
      <button role="tab" id="tab-results" aria-selected="false">測試結果</button>
      <button role="tab" id="tab-share" aria-selected="false">邀請受測者</button>
    </nav>
    <section id="v-setup"></section>
    <section id="v-results" class="hidden"></section>
    <section id="v-share" class="hidden"></section>
  </div>
</div>

<div id="tester" aria-live="polite">
  <div class="tbar"><span class="step" id="tStep"></span><span class="ttext" id="tText"></span>
    <button class="btn small" id="tShow">看任務</button><button class="btn small" id="tGiveUp">放棄這題</button></div>
  <iframe id="tFrame" title="受測原型" sandbox="allow-scripts allow-forms allow-modals"></iframe>
  <div class="overlay hidden" id="tOverlay"><div class="card" id="tCard"></div></div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const setText = (id, t) => { const e = $(id); if (e) e.textContent = t; };
const banner = m => { $("banner").textContent = m || ""; $("banner").classList.toggle("hidden", !m); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const secs = ms => ms == null ? "—" : (ms < 60000 ? Math.round(ms / 1000) + " 秒" : (ms / 60000).toFixed(1) + " 分");
const ROLES = ["公司同事", "餐廳老闆", "店員", "其他"];

async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || "GET", credentials: "same-origin",
    headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let data = null; try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && !path.startsWith("/api/login")) { showLogin(); }
  if (!r.ok) { const err = new Error((data && data.error) || `伺服器錯誤（${r.status}）`); err.status = r.status; throw err; }
  return data;
}

const TRACKER = `<script>(function(){
var cond=null,done=false;
function txt(n){return ((n.innerText||n.value||(n.getAttribute&&n.getAttribute('aria-label'))||n.alt||'')+'').replace(/\\s+/g,' ').trim();}
function inter(el){if(!el||!el.closest)return null;var c=el.closest('a,button,input,select,textarea,label,summary,[onclick],[role=button],[role=tab],[role=link],[role=menuitem],[tabindex]');if(c)return c;var e=el;while(e&&e!==document.body){try{if(getComputedStyle(e).cursor==='pointer')return e;}catch(x){}e=e.parentElement;}return null;}
function screen(){var hs=document.querySelectorAll('[data-screen],h1,h2');for(var i=0;i<hs.length;i++){var h=hs[i];if(h.getClientRects().length){var s=h.getAttribute('data-screen')||txt(h);if(s)return s.slice(0,30);}}return '';}
function hit(el){var n=el;while(n&&n!==document.body){var t=txt(n);if(t&&t.length<200&&t.indexOf(cond.text)>=0)return true;n=n.parentElement;}return false;}
function check(el){if(!cond||done||!cond.text)return;var ok=cond.type==='click'?(el&&hit(el)):((document.body.innerText||'').indexOf(cond.text)>=0);if(ok){done=true;parent.postMessage({__ut:1,type:'success'},'*');}}
document.addEventListener('click',function(e){var el=e.target,it=inter(el),a=el.closest&&el.closest('a[href]');if(a){var h=a.getAttribute('href')||'';if(h&&h.charAt(0)!=='#'&&!/^javascript:/i.test(h))e.preventDefault();}
var d=it||el;parent.postMessage({__ut:1,type:'click',tag:(d.tagName||'').toLowerCase(),text:txt(d).slice(0,40),interactive:!!it,x:+(e.clientX/innerWidth).toFixed(3),y:+(e.clientY/innerHeight).toFixed(3),screen:screen()},'*');
check(it||el);setTimeout(function(){if(cond&&cond.type==='visible')check(null);},400);},true);
document.addEventListener('submit',function(e){var f=e.target;if(f&&f.getAttribute&&/^https?:/i.test(f.getAttribute('action')||''))e.preventDefault();},true);
window.addEventListener('message',function(e){if(e.data&&e.data.__ut==='cond'){cond=e.data.cond;done=false;if(cond&&cond.type==='visible')setTimeout(function(){check(null);},50);}});
window.open=function(){return null;};
})();<\/script>`;

function withTracker(html) {
  const i = html.toLowerCase().lastIndexOf("</body>");
  return i >= 0 ? html.slice(0, i) + TRACKER + html.slice(i) : html + TRACKER;
}

/* ============ admin ============ */
const S = { me: null, list: [], sid: "", study: null, sessions: [], tab: "setup", trial: null, roleFilter: "" };

function showLogin() { $("loginBox").classList.remove("hidden"); $("main").classList.add("hidden"); $("btnLogout").classList.add("hidden"); $("pw").focus(); }
$("btnLogin").onclick = async () => {
  try { await api("/api/login", { method: "POST", body: { password: $("pw").value } }); $("pw").value = ""; $("loginBox").classList.add("hidden"); await bootAdmin(); }
  catch (e) { setText("loginMsg", e.message); }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("btnLogin").click(); });
$("btnLogout").onclick = async () => { await api("/api/logout", { method: "POST" }); showLogin(); };

async function bootAdmin() {
  S.me = await api("/api/me");
  if (!S.me.admin) { showLogin(); return; }
  $("main").classList.remove("hidden"); $("btnLogout").classList.remove("hidden");
  banner(S.me.aiReady ? "" : "伺服器尚未設定 AI 金鑰（AI_API_KEY），無法自動產生任務與整理發現，但仍可手動建立任務。");
  await loadList();
  if (!S.sid && S.list.length) S.sid = S.list[0].id;
  await openStudy(S.sid);
}
async function loadList() { S.list = await api("/api/studies"); }
async function openStudy(sid) {
  S.sid = sid || ""; S.study = null; S.sessions = []; S.trial = null;
  if (sid) { S.study = await api("/api/studies/" + sid); S.sessions = await api(`/api/studies/${sid}/sessions`); }
  renderAdmin();
}
["setup", "results", "share"].forEach(t => $("tab-" + t).onclick = async () => {
  S.tab = t; if (t === "results" && S.sid) S.sessions = await api(`/api/studies/${S.sid}/sessions`); renderAdmin(); });
$("studySel").onchange = () => openStudy($("studySel").value);
$("btnNew").onclick = () => { S.sid = ""; S.study = null; S.tab = "setup"; renderAdmin(); };

function renderAdmin() {
  $("studySel").innerHTML = S.list.length ? S.list.map(s => `<option value="${esc(s.id)}"${s.id === S.sid ? " selected" : ""}>${esc(s.name)}（${s.sessions} 人測過）</option>`).join("")
    + (S.sid ? "" : `<option value="" selected>（建立中的新測試）</option>`) : `<option value="">尚未建立測試</option>`;
  ["setup", "results", "share"].forEach(t => { $("tab-" + t).setAttribute("aria-selected", S.tab === t); $("v-" + t).classList.toggle("hidden", S.tab !== t); });
  if (S.tab === "setup") renderSetup();
  if (S.tab === "results") renderResults();
  if (S.tab === "share") renderShare();
}

/* ---------- setup ---------- */
function renderSetup() {
  const v = $("v-setup");
  if (!S.sid) {
    v.innerHTML = `<div class="panel stack" style="max-width:720px">
      <h2>上傳原型</h2>
      <p class="note">支援單一 HTML 檔（CSS、JavaScript 寫在同一個檔案裡），最大 5 MB。用 AI 生成的原型通常就是這種格式。</p>
      <div><label class="f" for="nName">測試名稱</label><input type="text" id="nName" placeholder="例如：Kiosk 點餐流程 v2"></div>
      <div><label class="f" for="nGoal">想測什麼（選填，讓 AI 出的任務更準）</label>
        <textarea id="nGoal" rows="3" placeholder="例如：想知道客人能不能自己完成加點、修改甜度冰塊，以及找到結帳按鈕"></textarea></div>
      <div class="drop"><input type="file" id="nFile" accept=".html,.htm,text/html"><p class="note" id="nFileMsg" style="margin:8px 0 0">選擇 .html 檔</p></div>
      <div class="row"><span class="note grow" id="nMsg"></span><button class="btn primary" id="nGo" disabled>上傳並產生任務</button></div>
    </div>`;
    let fileText = "";
    $("nFile").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      fileText = await f.text();
      setText("nFileMsg", `${f.name}（${Math.round(fileText.length / 1024)} KB）`);
      if (!$("nName").value) $("nName").value = f.name.replace(/\.html?$/i, "");
      $("nGo").disabled = false;
      $("nGo").textContent = S.me.aiReady ? "上傳並產生任務" : "上傳";
    };
    $("nGo").onclick = async () => {
      $("nGo").disabled = true; setText("nMsg", "上傳中…");
      try {
        const { id } = await api("/api/studies", { method: "POST", body: { name: $("nName").value.trim(), goal: $("nGoal").value.trim(), html: fileText } });
        if (S.me.aiReady) {
          setText("nMsg", "AI 正在閱讀原型、設計任務，約需 20–60 秒…");
          try { await api(`/api/studies/${id}/generate`, { method: "POST" }); }
          catch (e) { banner("自動產生任務失敗：" + e.message + "。可以按「重新產生」再試，或手動新增。"); }
        }
        await loadList(); await openStudy(id);
      } catch (e) { setText("nMsg", e.message); $("nGo").disabled = false; }
    };
    return;
  }
  const st = S.study; if (!st) { v.innerHTML = `<p class="note">讀取中…</p>`; return; }
  v.innerHTML = `<div class="split">
    <div class="frameBox"><div class="frameBar"><span class="grow" id="pvLabel">原型預覽（可以直接操作）</span><button class="btn small" id="pvReset">重新載入</button></div>
      <iframe id="pv" title="原型預覽" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
    <div>
      <div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">測試任務</h2>
        <button class="btn small" id="btnRegen"${S.me.aiReady ? "" : " disabled"}>重新產生</button><button class="btn small" id="btnAddTask">新增任務</button></div>
      <p class="note">每個任務都按一次「試做」：在左邊照著做，確認出現「偵測到完成」，代表自動判斷設定正確。</p>
      <div id="taskList"></div>
      <div class="row" style="margin-top:12px"><span class="note grow" id="saveMsg"></span><button class="btn primary" id="btnSaveTasks">儲存任務</button></div>
      <p class="note" style="margin-top:14px">${st.goal ? "測試目標：" + esc(st.goal) : ""}</p>
      <button class="btn small danger" id="btnDelStudy">刪除這個測試</button>
    </div></div>`;
  resetPreview();
  $("pvReset").onclick = () => { S.trial = null; setText("pvLabel", "原型預覽（可以直接操作）"); resetPreview(); };
  renderTasks();
  $("btnAddTask").onclick = () => { readTasks(); st.tasks.push({ id: uid("t"), prompt: "", cond: { type: "visible", text: "" }, path: [] }); renderTasks(); };
  $("btnSaveTasks").onclick = saveTasks;
  $("btnRegen").onclick = async () => {
    if (!confirm("重新產生會取代目前的任務，確定嗎？")) return;
    $("btnRegen").disabled = true; setText("saveMsg", "AI 正在產生任務…");
    try { const r = await api(`/api/studies/${S.sid}/generate`, { method: "POST" }); st.tasks = r.tasks; renderSetup(); }
    catch (e) { setText("saveMsg", e.message); $("btnRegen").disabled = false; }
  };
  $("btnDelStudy").onclick = async () => {
    if (!confirm("刪除後，原型、任務與所有測試結果都會消失，無法復原。確定嗎？")) return;
    await api("/api/studies/" + S.sid, { method: "DELETE" }); await loadList(); await openStudy(S.list[0]?.id || "");
  };
}
function resetPreview(cond) {
  const f = $("pv"); if (!f || !S.study) return;
  f.onload = () => { if (cond) f.contentWindow.postMessage({ __ut: "cond", cond }, "*"); };
  f.srcdoc = withTracker(S.study.html);
}
function renderTasks() {
  const st = S.study, el = $("taskList");
  if (!st.tasks.length) { el.innerHTML = `<p class="note">還沒有任務。</p>`; return; }
  el.innerHTML = st.tasks.map((t, i) => `<div class="task" data-i="${i}">
    <div class="row" style="margin-bottom:6px"><span class="num">任務 ${i + 1}</span><span class="grow"></span>
      <span class="ok hidden" data-ok="${i}">偵測到完成</span>
      <button class="btn small" data-trial="${i}">試做</button><button class="btn small" data-up="${i}" aria-label="上移"${i ? "" : " disabled"}>↑</button><button class="btn small" data-del="${i}">刪除</button></div>
    <label class="f" for="tp${i}">給受測者看的說明</label><textarea id="tp${i}" rows="2" data-k="prompt">${esc(t.prompt)}</textarea>
    <div class="cond" style="margin-top:8px"><div><label class="f" for="tc${i}">完成條件</label>
      <select id="tc${i}" data-k="type"><option value="visible"${t.cond.type === "visible" ? " selected" : ""}>畫面出現文字</option><option value="click"${t.cond.type === "click" ? " selected" : ""}>點了含這段文字的按鈕</option></select></div>
      <div><label class="f" for="tt${i}">文字</label><input type="text" id="tt${i}" data-k="text" value="${esc(t.cond.text)}"></div></div>
    <label class="f" for="tpa${i}" style="margin-top:8px">預期路徑（一行一步，寫要點的按鈕文字）</label><textarea id="tpa${i}" rows="${Math.max(3, (t.path || []).length + 1)}" data-k="path">${esc((t.path || []).join("\n"))}</textarea>
  </div>`).join("");
  el.querySelectorAll("[data-trial]").forEach(b => b.onclick = () => {
    readTasks(); const i = +b.dataset.trial, t = st.tasks[i];
    el.querySelectorAll("[data-ok]").forEach(x => x.classList.add("hidden"));
    S.trial = i; setText("pvLabel", `試做任務 ${i + 1}：${t.prompt}`); resetPreview(t.cond);
  });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { readTasks(); st.tasks.splice(+b.dataset.del, 1); renderTasks(); });
  el.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { readTasks(); const i = +b.dataset.up; [st.tasks[i - 1], st.tasks[i]] = [st.tasks[i], st.tasks[i - 1]]; renderTasks(); });
}
function readTasks() {
  document.querySelectorAll("#taskList .task").forEach(box => {
    const t = S.study.tasks[+box.dataset.i]; if (!t) return;
    t.prompt = box.querySelector('[data-k="prompt"]').value.trim();
    t.cond = { type: box.querySelector('[data-k="type"]').value, text: box.querySelector('[data-k="text"]').value.trim() };
    t.path = box.querySelector('[data-k="path"]').value.split("\n").map(s => s.trim()).filter(Boolean);
  });
}
async function saveTasks() {
  readTasks();
  const bad = S.study.tasks.findIndex(t => !t.prompt || !t.cond.text);
  if (bad >= 0) { setText("saveMsg", `任務 ${bad + 1} 的說明或完成條件是空的。`); return; }
  try { const r = await api(`/api/studies/${S.sid}/tasks`, { method: "PUT", body: { tasks: S.study.tasks } }); S.study.tasks = r.tasks; setText("saveMsg", "已儲存。"); }
  catch (e) { setText("saveMsg", e.message); }
}
window.addEventListener("message", e => {
  const pv = $("pv");
  if (pv && e.source === pv.contentWindow && e.data && e.data.__ut === 1 && e.data.type === "success" && S.trial != null) {
    const ok = document.querySelector(`[data-ok="${S.trial}"]`); if (ok) ok.classList.remove("hidden");
  }
});

/* ---------- results ---------- */
function statsFor(task, sessions) {
  const rs = sessions.map(s => (s.results || []).find(r => r.taskId === task.id)).filter(Boolean);
  const n = rs.length, opt = Math.max(1, (task.path || []).length);
  const succ = rs.filter(r => r.success), direct = succ.filter(r => (r.clicks || []).length <= opt);
  const first = (task.path || [])[0] || "";
  const fc = rs.filter(r => r.clicks && r.clicks[0]);
  const fcOk = first ? fc.filter(r => (r.clicks[0].text || "").includes(first) || first.includes(r.clicks[0].text || "\u0000")).length : null;
  const mis = rs.map(r => (r.clicks || []).filter(c => !c.interactive).length);
  const ratings = rs.map(r => r.rating).filter(x => x);
  const els = new Map();
  rs.forEach(r => (r.clicks || []).forEach(c => { const k = (c.text || `（${c.tag || "空白處"}）`) + (c.interactive ? "" : "\u0001"); els.set(k, (els.get(k) || 0) + 1); }));
  const top = [...els.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => ({ label: k.replace("\u0001", ""), miss: k.endsWith("\u0001"), count: v }));
  return { n, success: succ.length, direct: direct.length, indirect: succ.length - direct.length, gaveUp: n - succ.length,
    medianMs: median(succ.map(r => r.timeMs)), firstClick: fc.length && fcOk != null ? pct(fcOk, fc.length) : null,
    misAvg: n ? mis.reduce((a, b) => a + b, 0) / n : 0, rating: ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null,
    top, comments: rs.map(r => r.comment).filter(Boolean) };
}
function renderResults() {
  const v = $("v-results"), st = S.study;
  if (!st) { v.innerHTML = `<div class="panel"><p class="note">先建立一個測試。</p></div>`; return; }
  const sessions = S.sessions.filter(s => !S.roleFilter || s.role === S.roleFilter);
  const cards = st.tasks.map((t, i) => {
    const r = statsFor(t, sessions);
    if (!r.n) return `<div class="tcard"><h3>任務 ${i + 1}：${esc(t.prompt)}</h3><p class="note">還沒有人做這題。</p></div>`;
    const seg = (n, color) => n ? `<i style="width:${pct(n, r.n)}%;background:${color}"></i>` : "";
    return `<div class="tcard"><h3>任務 ${i + 1}：${esc(t.prompt)}</h3>
      <div class="bar" role="img" aria-label="直接成功 ${r.direct}、繞路成功 ${r.indirect}、放棄 ${r.gaveUp}">${seg(r.direct, "var(--good)")}${seg(r.indirect, "var(--warn)")}${seg(r.gaveUp, "var(--bad)")}</div>
      <div class="legend"><span><span class="dot" style="background:var(--good)"></span>直接成功 ${r.direct}（${pct(r.direct, r.n)}%）</span>
        <span><span class="dot" style="background:var(--warn)"></span>繞路後成功 ${r.indirect}</span><span><span class="dot" style="background:var(--bad)"></span>放棄 ${r.gaveUp}</span><span>共 ${r.n} 人</span></div>
      <div class="metrics">
        <div class="metric"><b>${pct(r.success, r.n)}%</b><span>完成率</span></div>
        <div class="metric"><b>${secs(r.medianMs)}</b><span>完成時間中位數</span></div>
        <div class="metric"><b>${r.firstClick == null ? "—" : r.firstClick + "%"}</b><span>第一下就點對</span></div>
        <div class="metric"><b>${r.misAvg.toFixed(1)}</b><span>平均誤點次數</span></div>
        <div class="metric"><b>${r.rating == null ? "—" : r.rating.toFixed(1)}</b><span>難易度（1 很難－5 很簡單）</span></div>
      </div>
      <details><summary class="note" style="cursor:pointer">最常被點的地方與受測者意見</summary>
        <p class="note" style="margin-top:8px">預期路徑：${esc((t.path || []).join(" → ") || "未設定")}</p>
        <div class="tblwrap"><table class="el"><thead><tr><th>點擊位置</th><th class="n">次數</th></tr></thead><tbody>
        ${r.top.map(x => `<tr><td>${esc(x.label)}${x.miss ? ' <span class="miss">（不能點的地方）</span>' : ""}</td><td class="n">${x.count}</td></tr>`).join("")}</tbody></table></div>
        ${r.comments.length ? `<ul>${r.comments.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
      </details></div>`;
  }).join("");
  const roles = [...new Set(S.sessions.map(s => s.role).filter(Boolean))];
  v.innerHTML = `<div class="row" style="margin-bottom:12px">
      <div style="flex:0 1 200px"><label class="f" for="rRole">受測者</label><select id="rRole"><option value="">全部</option>${roles.map(r => `<option${r === S.roleFilter ? " selected" : ""}>${esc(r)}</option>`).join("")}</select></div>
      <span class="grow"></span><button class="btn" id="btnRefresh">重新整理</button><button class="btn primary" id="btnInsight"${S.me.aiReady && sessions.length ? "" : " disabled"}>請 AI 整理發現</button></div>
    <div class="kpis"><span><b>${sessions.length}</b>位受測者</span><span><b>${st.tasks.length}</b>個任務</span></div>
    <div class="panel hidden" id="insight" style="margin-bottom:14px"></div>
    ${sessions.length ? cards : `<div class="panel"><h2>還沒有測試結果</h2><p class="note">到「邀請受測者」複製測試連結，傳給同事或餐廳夥伴。</p></div>`}`;
  $("rRole").onchange = () => { S.roleFilter = $("rRole").value; renderResults(); };
  $("btnRefresh").onclick = async () => { S.sessions = await api(`/api/studies/${S.sid}/sessions`); await loadList(); renderAdmin(); };
  $("btnInsight").onclick = async () => {
    const box = $("insight"); box.classList.remove("hidden"); box.innerHTML = `<h3>AI 的整理</h3><p class="insight" id="insTxt">AI 正在看結果，約需 10–30 秒…</p>`;
    const data = st.tasks.map((t, i) => { const r = statsFor(t, sessions); return { 任務: i + 1, 說明: t.prompt, 預期路徑: t.path, 人數: r.n, 直接成功: r.direct, 繞路成功: r.indirect, 放棄: r.gaveUp,
      完成時間中位數秒: r.medianMs == null ? null : Math.round(r.medianMs / 1000), 第一下點對百分比: r.firstClick, 平均誤點: +r.misAvg.toFixed(1), 難易度平均: r.rating && +r.rating.toFixed(1),
      最常點擊: r.top.map(x => `${x.label}${x.miss ? "(不可點)" : ""}×${x.count}`), 意見: r.comments.slice(0, 15) }; });
    try { const r = await api(`/api/studies/${S.sid}/insight`, { method: "POST", body: { people: sessions.length, data } }); setText("insTxt", r.text); }
    catch (e) { setText("insTxt", e.message); }
  };
}

/* ---------- share ---------- */
function renderShare() {
  const st = S.study;
  if (!st) { $("v-share").innerHTML = `<div class="panel"><p class="note">先建立一個測試。</p></div>`; return; }
  const link = `${location.origin}/t/${st.id}`;
  $("v-share").innerHTML = `<div class="stack" style="max-width:760px">
    <div class="panel stack"><h2>測試連結</h2>
      <p>把這個連結傳給受測者，不用登入、不用安裝，手機、平板、電腦都能打開。</p>
      <div class="linkbox"><input type="text" id="lnk" readonly value="${esc(link)}"><button class="btn primary" id="cp">複製</button></div>
      <p class="note" id="cpMsg"></p>
      <p class="note">傳連結時建議附一句說明，例如：「大約 5 分鐘，請照著畫面上的任務操作，不用擔心做錯」。</p></div>
    <div class="panel stack"><h2>現場測試</h2>
      <p>帶平板或筆電到餐廳，在裝置上打開同一個連結交給對方操作即可。測完會出現「再測一位」，可以連續測多人。</p>
      <div><a class="btn" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">在新分頁打開測試畫面</a></div></div>
    ${st.tasks.length ? "" : `<p class="banner">這個測試還沒有任務，受測者打開連結會看到「目前沒有進行中的測試」。</p>`}</div>`;
  $("cp").onclick = async () => { try { await navigator.clipboard.writeText(link); setText("cpMsg", "已複製。"); } catch (e) { $("lnk").select(); setText("cpMsg", "請按 Ctrl+C（Mac 按 ⌘+C）複製。"); } };
}

/* ============ tester ============ */
const T = { sid: "", st: null, i: 0, results: [], role: "", t0: 0, clicks: [], done: false };
function card(html) { $("tCard").innerHTML = html; $("tOverlay").classList.remove("hidden"); const f = $("tCard").querySelector("button,select,textarea"); if (f) f.focus(); }
function hideCard() { $("tOverlay").classList.add("hidden"); }
async function bootTester(sid) {
  document.body.classList.add("testing"); T.sid = sid;
  try { T.st = await api("/api/public/study/" + encodeURIComponent(sid)); }
  catch (e) { card(`<h2>找不到這個測試</h2><p class="note">連結可能有誤，或測試已經結束。請聯絡邀請你的人。</p>`); return; }
  if (!T.st.tasks.length) { card(`<h2>目前沒有進行中的測試</h2><p class="note">請稍後再試，或聯絡邀請你的人。</p>`); return; }
  document.title = T.st.name;
  welcome();
}
function welcome() {
  T.i = 0; T.results = [];
  card(`<h2>${esc(T.st.name)}</h2>
    <p>謝謝你幫忙！接下來會請你完成 ${T.st.tasks.length} 個小任務，大約 5 分鐘。</p>
    <p>我們測的是設計好不好用，不是測你。找不到的時候不用緊張，那正是我們想知道的地方；真的找不到可以按「放棄這題」。</p>
    <label class="f" for="tRole">你的身分</label><select id="tRole">${ROLES.map(r => `<option>${r}</option>`).join("")}</select>
    <div class="row" style="margin-top:16px"><span class="grow"></span><button class="btn primary" id="tStart">開始</button></div>`);
  $("tStart").onclick = () => { T.role = $("tRole").value; nextTask(); };
}
function nextTask() {
  if (T.i >= T.st.tasks.length) return finish();
  const t = T.st.tasks[T.i];
  setText("tStep", `任務 ${T.i + 1} / ${T.st.tasks.length}`); setText("tText", t.prompt);
  card(`<p class="note">任務 ${T.i + 1} / ${T.st.tasks.length}</p><p class="bigtask">${esc(t.prompt)}</p>
    <p class="note">完成後畫面會自動跳到下一題。任務會一直顯示在畫面上方。</p>
    <div class="row"><span class="grow"></span><button class="btn primary" id="tGo">開始這題</button></div>`);
  $("tGo").onclick = () => {
    hideCard(); T.clicks = []; T.done = false;
    const f = $("tFrame");
    f.onload = () => { f.contentWindow.postMessage({ __ut: "cond", cond: t.cond }, "*"); T.t0 = performance.now(); f.focus(); };
    f.srcdoc = withTracker(T.st.html);
  };
}
function endTask(success) {
  if (T.done) return; T.done = true;
  const t = T.st.tasks[T.i];
  const res = { taskId: t.id, success, timeMs: Math.round(performance.now() - T.t0), clicks: T.clicks.slice(0, 200), rating: null, comment: "" };
  T.results.push(res);
  let rating = null;
  card(`<h2>${success ? "完成了！" : "沒關係，這題跳過"}</h2>
    <p>這個任務做起來容易嗎？</p>
    <div class="scale" role="group" aria-label="難易度">${[1, 2, 3, 4, 5].map(n => `<button aria-pressed="false" data-r="${n}">${n}</button>`).join("")}</div>
    <div class="scale-l"><span>很難</span><span>很簡單</span></div>
    <label class="f" for="tCmt" style="margin-top:14px">有什麼想說的嗎？（選填）</label><textarea id="tCmt" rows="2"></textarea>
    <div class="row" style="margin-top:14px"><span class="grow"></span><button class="btn primary" id="tNext" disabled>${T.i + 1 < T.st.tasks.length ? "下一題" : "完成"}</button></div>`);
  $("tCard").querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    rating = +b.dataset.r; $("tCard").querySelectorAll("[data-r]").forEach(x => x.setAttribute("aria-pressed", x === b)); $("tNext").disabled = false; });
  $("tNext").onclick = () => { res.rating = rating; res.comment = $("tCmt").value.trim().slice(0, 300); T.i++; nextTask(); };
}
$("tGiveUp").onclick = () => { if (!T.done && T.st && $("tOverlay").classList.contains("hidden")) endTask(false); };
$("tShow").onclick = () => { const t = T.st?.tasks[T.i]; if (!t || T.done) return;
  card(`<p class="note">任務 ${T.i + 1} / ${T.st.tasks.length}</p><p class="bigtask">${esc(t.prompt)}</p><div class="row"><span class="grow"></span><button class="btn primary" id="tBack">繼續</button></div>`);
  $("tBack").onclick = hideCard; };
window.addEventListener("message", e => {
  if (!document.body.classList.contains("testing") || e.source !== $("tFrame").contentWindow || !e.data || e.data.__ut !== 1 || T.done) return;
  if (e.data.type === "click") T.clicks.push({ t: Math.round(performance.now() - T.t0), text: String(e.data.text || "").slice(0, 40), tag: String(e.data.tag || ""),
    interactive: !!e.data.interactive, x: +e.data.x || 0, y: +e.data.y || 0, screen: String(e.data.screen || "").slice(0, 30) });
  if (e.data.type === "success") setTimeout(() => endTask(true), 600);
});
async function finish() {
  setText("tStep", ""); setText("tText", ""); $("tFrame").srcdoc = "";
  const session = { role: T.role, device: { w: innerWidth, h: innerHeight }, results: T.results };
  card(`<h2>送出中…</h2>`);
  try {
    await api(`/api/public/study/${encodeURIComponent(T.sid)}/session`, { method: "POST", body: session });
    card(`<h2>全部完成，謝謝你！</h2><p>你的操作紀錄已經送出，可以關閉這個頁面了。</p>
      <div class="row"><span class="grow"></span><button class="btn" id="tAgain">再測一位</button></div>`);
    $("tAgain").onclick = welcome;
  } catch (e) {
    card(`<h2>送出失敗</h2><p>可能是網路不穩，請確認連線後再按一次。你的操作紀錄還在，不需要重做。</p>
      <div class="row"><span class="grow"></span><button class="btn primary" id="tRetry">再送一次</button></div>`);
    $("tRetry").onclick = finish;
  }
}

/* ============ boot ============ */
const m = location.pathname.match(/^\/t\/([^/]+)/);
if (m) bootTester(decodeURIComponent(m[1]));
else bootAdmin().catch(() => showLogin());
})();
</script>
